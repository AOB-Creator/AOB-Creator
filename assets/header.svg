<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Alpamis Omirbekov - GitHub Profile Header</title>

  <!-- Background -->
  <rect width="680" height="420" rx="12" fill="#11111b"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="680" height="44" rx="12" fill="#1e1e2e"/>
  <rect x="0" y="30" width="680" height="14" fill="#1e1e2e"/>

  <!-- Traffic lights -->
  <circle cx="30" cy="22" r="7" fill="#ff5f57"/>
  <circle cx="54" cy="22" r="7" fill="#ffbd2e"/>
  <circle cx="78" cy="22" r="7" fill="#28ca41"/>

  <!-- Title bar label -->
  <text x="340" y="27" text-anchor="middle" fill="#585b70" font-family="'SF Mono', 'Fira Code', monospace" font-size="12">https://github.com/AOB-Creator: ~/profile</text>

  <!-- Prompt 1: whoami -->
  <text x="30" y="80" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#28ca41">$</text>
  <text x="46" y="80" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#cdd6f4"> whoami</text>

  <text x="30" y="102" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#cdd6f4">Alpamis Omirbekov</text>
  <text x="222" y="102" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#45475a"> // Middle Angular Developer</text>

  <!-- Prompt 2: expertise -->
  <text x="30" y="132" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#28ca41">$</text>
  <text x="46" y="132" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#cdd6f4"> ls ~/expertise</text>

  <text x="30" y="154" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#89b4fa">angular  </text>
  <text x="112" y="154" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#89b4fa">typescript  </text>
  <text x="224" y="154" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#89b4fa">rxjs  </text>
  <text x="278" y="154" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#89b4fa">oracle  </text>
  <text x="346" y="154" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#89b4fa">pl/sql  </text>
  <text x="410" y="154" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#89b4fa">network-security</text>

  <!-- Prompt 3: stack -->
  <text x="30" y="184" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#28ca41">$</text>
  <text x="46" y="184" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#cdd6f4"> cat ~/.stack</text>

  <text x="30" y="206" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#585b70">frontend  :</text>
  <text x="130" y="206" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#a6e3a1"> Angular · TypeScript · RxJS · NgRx · PrimeNG</text>

  <text x="30" y="226" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#585b70">database  :</text>
  <text x="130" y="226" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#a6e3a1"> Oracle 19c · PL/SQL · MySQL</text>

  <text x="30" y="246" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#585b70">tools     :</text>
  <text x="130" y="246" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#a6e3a1"> Docker · Git · WebStorm · Linux</text>

  <!-- Prompt 4: status -->
  <text x="30" y="276" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#28ca41">$</text>
  <text x="46" y="276" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#cdd6f4"> cat ~/.status</text>

  <text x="30" y="298" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#cdd6f4">Building enterprise banking systems at SQB.</text>
  <text x="30" y="318" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#cdd6f4">Turning complex financial logic into clean Angular code.</text>

  <!-- Prompt 5: location -->
  <text x="30" y="348" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#28ca41">$</text>
  <text x="46" y="348" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#cdd6f4"> cat ~/.location</text>

  <text x="30" y="370" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#cdd6f4">Tashkent, Uzbekistan 🇺🇿</text>

  <!-- Cursor blink -->
  <text x="30" y="400" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#28ca41">$</text>
  <rect x="46" y="387" width="9" height="15" fill="#28ca41" opacity="0.9"/>
</svg>
